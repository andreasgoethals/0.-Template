[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "{{PACKAGE_NAME}}"
version = "0.1.0"
description = "{{DESCRIPTION}}"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "{{AUTHOR}}", email = "{{EMAIL}}" }]

# Record the exact runtime for reproducibility; validate dependencies before broadening support.
requires-python = ">=3.11,<3.13"

dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "pyyaml>=6.0",            # available for each project's YAML loader
    "matplotlib>=3.8",        # src/visualize/
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Testing/lint tools plus a Jupyter kernel for interactive
# notebooks/. Nothing here is imported by src/, so a production install stays thin.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ipykernel>=6.29",
]

[project.urls]
Repository = "{{REPO_URL}}"

# Keep discovery inside our importable source; libraries/assets are not project packages.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tfm-library*", "vsc-library*", "dm-library*", "notebooks*", "data*", "output*", "checkpoints*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    # Read-only submodule. Never lint, never format, never touch.
    "tfm-library", "vsc-library", "dm-library",
    # Generated output and notebook JSON are not source.
    "output",
    "notebooks",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]
ignore = [
    "E501",    # line length is the formatter's job, not the linter's
    "B905",    # zip(strict=) noise in numeric code
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Upstream snapshots and generated assets are not this project's tests.
norecursedirs = ["tfm-library", "vsc-library", "dm-library", "output", "data", ".venv", "venv", "notebooks"]
markers = [
    "slow: takes more than a few seconds",
    "gpu: requires CUDA; tests must explicitly check availability or be deselected",
]
